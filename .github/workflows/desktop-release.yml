name: Publish Manifest Network Desktop Release

on:
  workflow_run:
    workflows: ["Build Manifest Network Desktop"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(github.event.workflow_run.head_commit.message, '[release]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download desktop build artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: manifest-network-*
          path: artifacts

      - name: Prepare public installers
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="$(tr -d '[:space:]' < desktop/release-version.txt)"
          test -n "$VERSION"
          mkdir -p release

          APPLE_DMG="$(find artifacts/manifest-network-macos-apple-silicon -type f -name '*.dmg' | head -n 1)"
          INTEL_DMG="$(find artifacts/manifest-network-macos-intel -type f -name '*.dmg' | head -n 1)"
          WINDOWS_EXE="$(find artifacts/manifest-network-windows-x64 -type f -name '*.exe' | head -n 1)"
          WINDOWS_MSI="$(find artifacts/manifest-network-windows-x64 -type f -name '*.msi' | head -n 1)"

          test -n "$APPLE_DMG"
          test -n "$INTEL_DMG"
          test -n "$WINDOWS_EXE"
          test -n "$WINDOWS_MSI"

          cp "$APPLE_DMG" "release/Manifest-Network-${VERSION}-Apple-Silicon.dmg"
          cp "$INTEL_DMG" "release/Manifest-Network-${VERSION}-Intel.dmg"
          cp "$WINDOWS_EXE" "release/Manifest-Network-${VERSION}-Windows-x64.exe"
          cp "$WINDOWS_MSI" "release/Manifest-Network-${VERSION}-Windows-x64.msi"

          cat > release-notes.md <<EOF
          # Manifest Network Desktop ${VERSION}

          Private local AI with an optional community-network participation layer.

          ## What this alpha includes
          - local hardware analysis;
          - automatic local-model installation;
          - bundled local inference;
          - private chat on the user's computer;
          - Manifest Network participation controls for performance, compute, learning, and human feedback.

          ## Network status
          The contribution network is still a product preview in this release. Participation preferences are stored locally; the alpha does not yet transmit network jobs, learning packets, or contribution credits.

          ## Downloads
          - **Mac — Apple Silicon:** M1, M2, M3, M4 and later Apple-silicon Macs.
          - **Mac — Intel:** older Intel-based Macs.
          - **Windows x64:** standard installer plus MSI package.

          ## Security note
          Mac builds are ad-hoc signed but are not yet Apple-notarized, so macOS may require **System Settings → Privacy & Security → Open Anyway** on first launch. Windows may similarly show SmartScreen until production code signing is added.
          EOF

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          VERSION="$(tr -d '[:space:]' < desktop/release-version.txt)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "Manifest Network Desktop ${VERSION}" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" release/* \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "Manifest Network Desktop ${VERSION}" \
              --notes-file release-notes.md \
              --latest
          fi
